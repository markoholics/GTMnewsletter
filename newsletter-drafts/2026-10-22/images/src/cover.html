<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1F4E79;--ink:#1A1A1A;--grey:#555555;--paper:#F7F5F0}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink)}
.serif{font-family:Georgia,"DejaVu Serif",serif}
.label{font-family:Inter,Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:18px;font-weight:600}

body{width:1280px;height:720px;background:var(--navy);color:var(--paper);padding:72px 88px;position:relative}
h1{font-size:60px;line-height:1.18;font-weight:700;margin-top:34px;max-width:1100px}
.rule{width:96px;height:6px;background:var(--paper);margin-top:44px}
.by{position:absolute;left:88px;bottom:64px;font-size:24px;opacity:.92}
.by b{font-weight:600}
</style></head><body>
<div class="label">GTM newsletter issue</div>
<h1 class="serif">Your GTM stack needs a column called &ldquo;how do we know?&rdquo;</h1>
<div class="rule"></div>
<div class="by"><b>Mohammad H. Rahman</b></div>
</body></html>
