<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1F4E79;--ink:#1A1A1A;--grey:#555555;--paper:#F7F5F0}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink)}
.serif{font-family:Georgia,"DejaVu Serif",serif}
.label{font-family:Inter,Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:18px;font-weight:600}

body{width:1200px;height:628px;background:var(--paper);padding:56px 80px;position:relative}
.big{font-size:230px;line-height:1;font-weight:700;color:var(--navy);margin-top:20px}
.stmt{font-size:40px;line-height:1.25;margin-top:14px;max-width:1000px}
.src{position:absolute;left:80px;right:80px;bottom:44px;font-size:20px;color:var(--grey);border-top:2px solid #cfcabd;padding-top:16px}
</style></head><body>
<div class="label" style="color:var(--navy)">One dataset, one hidden problem</div>
<div class="big serif">51%</div>
<div class="stmt serif">of the cold email &ldquo;replies&rdquo; in a 6.07 million message dataset were auto-replies.</div>
<div class="src">Source: Grow Surely data, as reported in The GTM Engineer Pulse #46. One agency&rsquo;s client mix, not a random sample.</div>
</body></html>
