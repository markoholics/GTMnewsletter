<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1F4E79;--ink:#1A1A1A;--grey:#555555;--paper:#F7F5F0}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink)}
.serif{font-family:Georgia,"DejaVu Serif",serif}
.label{letter-spacing:.14em;text-transform:uppercase;font-size:18px;font-weight:600}
body{width:1200px;height:628px;background:var(--navy);color:var(--paper);padding:72px 84px;position:relative}
q{display:block;font-size:64px;line-height:1.22;font-weight:700;margin-top:40px;quotes:"\201C" "\201D"}
.by{position:absolute;left:84px;bottom:60px;font-size:24px}
.rule{width:96px;height:6px;background:var(--paper);margin-top:44px}
</style></head><body>
<div class="label">Worth pinning above your desk</div>
<q class="serif">Scarcity on top of a mediocre product is just friction.</q>
<div class="rule"></div>
<div class="by">GTM Strategist newsletter, on Instinct's invite-only launch</div>
</body></html>
