<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--k:#0A0A0A;--w:#FFFFFF;--g1:#F2F2F2;--g2:#D4D4D4;--g3:#8C8C8C;--g4:#555555}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--k);background:var(--w)}
.mono{font-family:"DejaVu Sans Mono",Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600}
.dots{display:flex;gap:8px}.dots i{width:13px;height:13px;border:2px solid var(--k);border-radius:50%;display:block}
.win{border:3px solid var(--k);background:var(--w);box-shadow:10px 10px 0 var(--k)}
.bar{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:3px solid var(--k);background:var(--g1)}
.blk{background:var(--k);color:var(--w)}
body{width:1200px;height:628px;padding:48px 64px;background:var(--g1)}
.win{height:532px;position:relative}
.big{font-size:170px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:34px 0 0 44px}
.txt{font-size:32px;line-height:1.35;margin:18px 44px 0;max-width:900px;color:var(--g4)}
.src{position:absolute;left:44px;right:44px;bottom:24px;border-top:2px solid var(--g2);padding-top:14px;font-size:19px;color:var(--g4)}
</style></head><body><div class="win"><div class="bar blk"><div class="dots"><i style="border-color:#fff"></i><i style="border-color:#fff"></i><i style="border-color:#fff"></i></div><span class="mono">By the numbers</span></div>
<div class="big">500 to 700</div>
<div class="txt">distinct ads a month, run by a single media buyer, once creators were paid on performance.</div>
<div class="src">Source: GTM Weekly #31 (Work-Bench), reporting Wispr Flow's paid growth strategy. Reported, not audited.</div></div>
</body></html>
