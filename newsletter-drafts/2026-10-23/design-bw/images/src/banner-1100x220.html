<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}

.mast{width:100%;height:100%;border:3px solid #0A0A0A;box-shadow:8px 8px 0 #0A0A0A;background:#fff;display:flex;flex-direction:column}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px}
.name{font-size:68px;line-height:1;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.tag{font-size:19px;font-style:italic;color:#555;margin-top:10px}
</style></head><body><div class="mast"><div class="top"><div class="dots"><i></i><i></i><i></i></div><span class="mono">Newsletter / long read</span></div>
