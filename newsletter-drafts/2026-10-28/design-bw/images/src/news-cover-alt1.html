<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--k:#0A0A0A;--w:#FFFFFF;--g1:#F2F2F2;--g2:#D4D4D4;--g3:#8C8C8C;--g4:#555555}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--k);background:var(--g1);width:1280px;height:720px;padding:56px 80px}
.mono{font-family:"DejaVu Sans Mono",Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600}
.dots{display:flex;gap:8px}.dots i{width:13px;height:13px;border:2px solid var(--k);border-radius:50%;display:block}
.win{border:3px solid var(--k);background:var(--w);box-shadow:10px 10px 0 var(--k);height:608px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:3px solid var(--k);background:var(--g1)}
.in{padding:30px 52px 0;flex:1;position:relative}
.kick{display:flex;align-items:center;gap:16px}
.tag{background:var(--k);color:var(--w);padding:7px 14px 6px}
h1{margin-top:22px;font-size:82px;line-height:1.02;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;max-width:1130px}
.deck{margin-top:22px;font-size:26px;line-height:1.35;color:var(--g4);max-width:960px}
.by{position:absolute;left:52px;right:52px;bottom:26px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--k);padding-top:14px}
.by b{font-size:22px}
</style></head><body><div class="win"><div class="bar"><div class="dots"><i></i><i></i><i></i></div><span class="mono" style="color:var(--g4)">PREVIOUSLY IN GTM / front page</span></div>
<div class="in"><div class="kick"><span class="mono tag">Breaking</span><span class="mono" style="color:var(--g3)">Renewals / 28 Oct 2026</span></div>
<h1>Renewal memo due before the first deal is signed</h1><div class="deck">The one page document your buyer's champion will need in ninety days.</div>
<div class="by"><b>Mohammad H. Rahman</b><span class="mono" style="color:var(--g3)">Read the long version</span></div></div></div>
</body></html>
