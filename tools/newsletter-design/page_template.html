<title>{{page_title}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single reading column, window-chrome masthead, black header bars on every figure */
:root{--bg:#FFFFFF;--fg:#0A0A0A;--soft:#F2F2F2;--line:#D4D4D4;--mid:#8C8C8C;--dim:#555555;--ink-bg:#0A0A0A;--ink-fg:#FFFFFF;
--sans:Inter,system-ui,Helvetica,Arial,sans-serif;--mono:"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--fg:#F2F2F2;--soft:#1A1A1A;--line:#333333;--mid:#8C8C8C;--dim:#B0B0B0;--ink-bg:#F2F2F2;--ink-fg:#0A0A0A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0A0A;--fg:#F2F2F2;--soft:#1A1A1A;--line:#333333;--mid:#8C8C8C;--dim:#B0B0B0;--ink-bg:#F2F2F2;--ink-fg:#0A0A0A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin-inline:auto;padding-block:28px 72px}
.mono{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.dots{display:inline-flex;gap:7px}.dots i{width:11px;height:11px;border:2px solid currentColor;border-radius:50%;display:block}
.mast{border:2px solid var(--fg);box-shadow:6px 6px 0 var(--fg);margin-bottom:40px}
.mast .top{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:2px solid var(--fg);background:var(--soft);color:var(--dim)}
.mast .name{padding:26px 22px 22px;font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.03em}
.mast .name span{color:var(--mid)}
.mast .tag{padding:0 22px 20px;color:var(--dim);font-style:italic;font-size:15px}
h1{font-size:clamp(32px,6.4vw,46px);line-height:1.08;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.stand{font-size:21px;line-height:1.4;color:var(--dim);margin-top:14px}
.by{margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--dim)}
.draft{background:var(--ink-bg);color:var(--ink-fg);padding:5px 9px}
.acts-unused{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-block:1px solid var(--line);padding-block:14px;margin-block:22px 34px}
button{font:600 14px var(--sans);background:transparent;color:var(--fg);border:1.5px solid var(--fg);border-radius:999px;padding:9px 18px;cursor:pointer}
button:hover{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
#msg{font-size:14px;color:var(--dim);flex-basis:100%;min-height:1.2em}
.pr{margin-left:auto;font-size:13px;color:var(--dim)}
.pr a{color:var(--fg)}
article{font-size:18px;line-height:1.7}
article p{margin-block:0 1.15em}
article h2{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-block:2.1em .55em;text-wrap:balance}
article blockquote{margin:1.6em 0;padding:4px 0 4px 20px;border-left:6px solid var(--fg);font-size:23px;line-height:1.4;font-weight:600}
article a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
article ol,article ul{padding-left:1.3em;margin-block:0 1.2em}
article li{margin-bottom:.7em}
article li::marker{font-weight:800}
figure{margin:2em 0;border:2px solid var(--fg)}
.chrome{display:flex;align-items:center;gap:14px;padding:8px 12px;background:var(--ink-bg);color:var(--ink-fg)}
.chrome .lab{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
figure img{display:block;width:100%;height:auto;background:#fff}
.foot{margin-top:56px;padding-top:20px;border-top:2px solid var(--fg);color:var(--dim);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
<div class="wrap">
<div class="mast"><div class="top"><span class="dots"><i></i><i></i><i></i></span><span class="mono">newsletter / long read</span></div>
<div class="name">{{name}}</div><div class="tag">{{tagline}}</div></div>
<h1 id="headline">{{title}}</h1>
<p class="stand">{{standfirst}}</p>
<div class="by mono"><span>By {{byline}} &nbsp;|&nbsp; {{date_display}}</span></div>
<article id="art">{{article}}</article>
<div class="foot"><span class="mono">{{name}}</span><span>By {{byline}}</span></div>
</div>
