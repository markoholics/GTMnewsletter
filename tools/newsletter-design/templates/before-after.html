<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--k:#0A0A0A;--w:#FFFFFF;--g1:#F2F2F2;--g2:#D4D4D4;--g3:#8C8C8C;--g4:#555555}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--k);background:var(--w)}
.mono{font-family:"DejaVu Sans Mono",Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600}
.dots{display:flex;gap:8px}.dots i{width:13px;height:13px;border:2px solid var(--k);border-radius:50%;display:block}
.win{border:3px solid var(--k);background:var(--w);box-shadow:10px 10px 0 var(--k)}
.bar{display:flex;align-items:center;gap:16px;padding:11px 18px;border-bottom:3px solid var(--k);background:var(--g1)}
.blk{background:var(--k);color:var(--w)}
body{width:1200px;height:628px;padding:36px 56px;background:var(--w)}
.p{border:3px solid var(--k);margin-bottom:24px}
.p .h{padding:9px 16px;display:flex;justify-content:space-between}
.flow{display:flex;align-items:center;gap:0;padding:30px 20px 22px}
.n{border:2px solid var(--k);padding:12px 14px;font-size:19px;font-weight:600;flex:1;text-align:center;background:var(--w);min-height:92px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.a{width:36px;text-align:center;font-size:26px;flex:none}
.hl{background:var(--k);color:var(--w)}
.dash{border-style:dashed;background:var(--g1);color:var(--g4)}
.note{padding:0 20px 20px;font-size:18px;color:var(--g4)}
.t{font-size:17px;color:var(--g4);text-align:center;margin-top:-4px}
</style></head><body>
{{panels}}
<div class="t">{{footnote}}</div>
</body></html>
