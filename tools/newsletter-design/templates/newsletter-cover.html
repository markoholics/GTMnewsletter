<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Helvetica,Arial,sans-serif;background:#fff;color:#0A0A0A;width:1280px;height:720px;display:flex;align-items:center;justify-content:center}
.mast{width:1040px;border:4px solid #0A0A0A;box-shadow:14px 14px 0 #0A0A0A;background:#fff}
.top{display:flex;align-items:center;gap:20px;padding:16px 26px;border-bottom:4px solid #0A0A0A;background:#F2F2F2;color:#555}
.dots{display:flex;gap:10px}.dots i{width:20px;height:20px;border:3px solid #555;border-radius:50%;display:block}
.mono{font-family:"DejaVu Sans Mono",Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.name{padding:56px 40px 32px;font-size:88px;white-space:nowrap;line-height:1;font-weight:800;letter-spacing:-.04em}
.tag{padding:0 40px 48px;font-size:30px;font-style:italic;color:#555}
</style></head><body><div class="mast"><div class="top"><div class="dots"><i></i><i></i><i></i></div><span class="mono">Newsletter / long read</span></div>
<div class="name">{{name}}</div><div class="tag">{{tagline}}</div></div></body></html>
